<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <main class="card">
        <h1 class="card-title">Animales</h1>
        <h2 class="card-subtitle">Agrega tu nombre</h2>
        
        <ul class="name-list">
            <li class="name-item">Agustín Perriello</li>
            <li class="name-item">Marco Pelloni</li>
            <li class="name-item">Tomás Barcudi</li>
        </ul>

        <figure>
            <h3>Gato</h3>
         <img src="./img/descarga.webp" alt="Gato" class="profile-img">
          <figcaption>El gato es un mamífero doméstico, ágil, curioso e independiente.</figcaption>
        </figure>

        <figure>
            <h3>Hipopótamo</h3>
         <img src="/img/hipopotamo.jpg" alt="Hipopótamo" class="profile-img">
         <figcaption>El hipopótamo es un gran mamífero que vive cerca de ríos y lagos de África.</figcaption>
        </figure>

        <figure>
            <h3>Jirafa</h3>
         <img src="/img/jirafa.webp" alt="Jirafa" class="profile-img">
         <figcaption>La jirafa es el animal terrestre más alto y utiliza su largo cuello para alcanzar las hojas de los árboles.</figcaption>
        </figure>
    </main>

</body>
</html>
